[project]
name = "dsr"
version = "0.1.0"
description = "Cross-sectional next-day stock return prediction from a single public data source"
authors = [
    { name = "Andres Blanco Prada", email = "ablancoprada@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "altair>=6.3.0",
    "exchange-calendars>=4.13.2",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "marimo>=0.25.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
